name: Web CI and delivery
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
      - run: tar -czf web-dist.tar.gz -C dist . && sha256sum web-dist.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web-dist.tar.gz
            SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" web-dist.tar.gz SHA256SUMS --verify-tag --generate-notes
